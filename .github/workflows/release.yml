name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default: the build jobs run third-party actions, dependency
# build scripts and install hooks, none of which may hold a token that can
# publish. Only the job that creates the release asks for more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, ext: "" }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-latest, ext: "" }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, ext: ".exe" }
          - { target: aarch64-pc-windows-msvc, runner: windows-latest, ext: ".exe" }
          - { target: x86_64-apple-darwin, runner: macos-latest, ext: "" }
          - { target: aarch64-apple-darwin, runner: macos-latest, ext: "" }
    steps:
      - uses: actions/checkout@v7
      # A v* tag can be neither moved nor deleted, so one that disagrees with the
      # version the agent reports stops here, before anything is published.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "$GITHUB_REF_NAME" = "$V" ] || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $V"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: cargo install --locked cross
      - if: runner.os == 'Linux'
        run: cross build --release --locked --target ${{ matrix.target }}
      - if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
      # Exercise the actual installers on disposable native runners before
      # uploading an artifact. Cross-built architectures are checked above.
      - if: runner.os != 'Linux'
        uses: actions/checkout@v7
        with:
          repository: Su-cyber-art/monitor
          ref: main
          path: installers
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /install.ps1
            /install-macos.sh
      - if: runner.os == 'Windows' && runner.arch == 'X64' && matrix.target == 'x86_64-pc-windows-msvc'
        name: Verify Windows service installation and upgrade
        shell: pwsh
        run: |
          $binary = "$PWD/target/${{ matrix.target }}/release/monitor-agent.exe"
          try {
            & ./installers/install.ps1 -Server http://127.0.0.1:1 -Token ci-test-token -Interval 2 -Binary $binary
            & ./installers/install.ps1 -Upgrade -Binary $binary
            $saved = Get-Content "$env:ProgramData/monitor/agent.json" -Raw | ConvertFrom-Json
            if ($saved.MONITOR_TOKEN -ne 'ci-test-token' -or $saved.MONITOR_INTERVAL -ne '2') { throw 'Upgrade did not preserve configuration' }
            if ((Get-Service monitor-agent).Status -ne 'Running') { throw 'Agent service is not running' }
          } finally {
            & ./installers/install.ps1 -Uninstall
          }
      - if: runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.target == 'aarch64-apple-darwin'
        name: Verify macOS launchd installation and upgrade
        run: |
          trap 'sudo sh installers/install-macos.sh --uninstall' EXIT
          BINARY="$PWD/target/${{ matrix.target }}/release/monitor-agent"
          sudo sh installers/install-macos.sh --server http://127.0.0.1:1 --token ci-test-token --interval 2 --binary "$BINARY"
          sudo sh installers/install-macos.sh --upgrade --binary "$BINARY"
          sudo grep -qx 'MONITOR_TOKEN=ci-test-token' /usr/local/monitor/agent.env
          sudo grep -qx 'MONITOR_INTERVAL=2' /usr/local/monitor/agent.env
          sudo launchctl print system/dev.monitor.agent | grep -q 'state = running'
      # install.sh downloads exactly this name; changing it breaks every
      # install command the hub issues.
      - run: cp "target/${{ matrix.target }}/release/monitor-agent${{ matrix.ext }}" "monitor-agent-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: monitor-agent-${{ matrix.target }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # The hub relays these through an operator-configured GitHub proxy and
      # install.sh executes what arrives, so the hub relays a binary only with a
      # signature that verifies under the public key built into it. The private
      # key reaches this job alone. Checked against that same public key here, so
      # a secret holding any other key fails the release instead of publishing
      # binaries no hub will relay. Runs on a manual dispatch too.
      - run: |
          [ -n "$AGENT_SIGNING_KEY" ] || { echo "::error::the AGENT_SIGNING_KEY secret is not set"; exit 1; }
          umask 077
          trap 'rm -f "$RUNNER_TEMP/key.pem"' EXIT
          printf '%s\n' "$AGENT_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/pub.pem"
          for b in monitor-agent-*; do
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in "$b" -out "$b.sig"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/pub.pem" -rawin -in "$b" -sigfile "$b.sig"
          done
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
          # The hub's `AGENT_SIGNING_KEY` (src/main.rs in the hub repository).
          PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEATGVSH4REkcKS5JrEq/ZXw/tTB7+tDR8ajfPnh6SP80I=
            -----END PUBLIC KEY-----
      # A manual dispatch builds and signs the binaries; only a tag publishes,
      # so the path can be exercised without cutting a release. gh ships on the
      # runner, keeping a third-party action out of the contents:write step.
      # Checksums use bare names and cover binaries and signatures for every platform.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p bin && mv monitor-agent-* bin/
          (cd bin && sha256sum monitor-agent-* > sha256sums.txt)
          gh release create "$GITHUB_REF_NAME" bin/monitor-agent-* bin/sha256sums.txt \
            --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
