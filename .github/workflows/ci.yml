name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Prose changes nothing a compiler or linter can check.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # A hanging test would otherwise consume the six-hour default; the suite
    # runs in well under a second.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # This commit's agent against the latest released hub, through the hub
      # repository's end-to-end script: the reported fields are checked where
      # the hub and the themes read them, not only where they are serialized.
      - if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: monitor-probe/monitor
          path: hub
          sparse-checkout: scripts
      - if: runner.os == 'Linux'
        run: cargo build
      - if: runner.os == 'Linux'
        run: |
          curl -fsSL -o monitor-hub https://github.com/monitor-probe/monitor/releases/latest/download/monitor-hub-x86_64-unknown-linux-musl
          chmod +x monitor-hub
      - if: runner.os == 'Linux'
        run: hub/scripts/e2e.sh ./monitor-hub target/debug/monitor-agent
