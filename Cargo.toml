[package]
name = "monitor-agent"
version = "1.5.0"
edition = "2021"
license = "MIT"
description = "Cross-platform monitoring agent for the monitor hub"
repository = "https://github.com/Su-cyber-art/agent"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A single-threaded runtime suffices: one report every few seconds plus a
# handful of TCP probes.
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util", "fs", "process"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# tokio-tungstenite leaves the crypto provider to the caller: rustls
# selects one automatically only when exactly one provider feature is enabled.
# Without this the agent panics on its first wss:// connection.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
if-addrs = "0.15.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }
netstat2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
# Only the tests need a movable clock; the write-deadline arithmetic spans
# minutes. dev-dependencies do not reach the shipped binary.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
